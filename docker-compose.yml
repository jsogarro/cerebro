version: '3.9'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: ["/entrypoint.sh"]
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - source_snapshots:/var/lib/cerebro/source_snapshots
    environment:
      - SOURCE_SNAPSHOT_DIR=/var/lib/cerebro/source_snapshots
      # The runtime is bound by row-level security; migrations run as the owner.
      - DATABASE_URL=postgresql+asyncpg://cerebro_app:app-dev-only@postgres:5432/research_db
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://cerebro_migrator:migrator-dev-only@postgres:5432/research_db
      - ROLES_ADMIN_DATABASE_URL=postgresql+asyncpg://research:research123@postgres:5432/research_db
      - CEREBRO_MIGRATOR_PASSWORD=migrator-dev-only
      - CEREBRO_APP_PASSWORD=app-dev-only
      - CEREBRO_MAINT_PASSWORD=maint-dev-only
      - MAINTENANCE_DATABASE_URL=postgresql+asyncpg://cerebro_maint:maint-dev-only@postgres:5432/research_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key-32-chars}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-100}
      # In-process MASR configuration. The old heuristic alias does not enable
      # the Thompson bandit.
      - MASR_ENABLE_ADAPTIVE=${MASR_ENABLE_ADAPTIVE:-true}
      - ADAPTIVE_ROUTING_ENABLED=${ADAPTIVE_ROUTING_ENABLED:-false}
      - MEMORY_INFORMED_ROUTING_ENABLED=${MEMORY_INFORMED_ROUTING_ENABLED:-false}
      - MCP_SERVER_ENABLED=${MCP_SERVER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=research
      - POSTGRES_PASSWORD=research123
      - POSTGRES_DB=research_db
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # pgAdmin for Database Management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@research.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    profiles:
      - dev-tools

  # Redis Commander (Development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    profiles:
      - dev-tools

  # React Web Frontend
  web:
    build:
      context: ./cerebro/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1  # Points via nginx if we had it, but actually the web's nginx proxies? Wait, no we serve static files. If it's static, /api/v1 works if we access the app via a reverse proxy that routes /api/v1 to `api` container, or the web's own nginx handles proxying. 
    ports:
      # Container nginx listens on 8080 so it can run as the unprivileged
      # `nginx` user; host-side mapping keeps the same `localhost:3000`
      # developer entrypoint.
      - "${WEB_HOST_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  research-network:
    driver: bridge

volumes:
  source_snapshots:
  postgres_data:
  redis_data:
