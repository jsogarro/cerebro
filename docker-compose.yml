version: '3.9'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: ["/entrypoint.sh"]
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=postgresql+asyncpg://research:research123@postgres:5432/research_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key-32-chars}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      # In-process MASR configuration. The old heuristic alias does not enable
      # the Thompson bandit.
      - MASR_ENABLE_ADAPTIVE=${MASR_ENABLE_ADAPTIVE:-true}
      - ADAPTIVE_ROUTING_ENABLED=${ADAPTIVE_ROUTING_ENABLED:-false}
      - MEMORY_INFORMED_ROUTING_ENABLED=${MEMORY_INFORMED_ROUTING_ENABLED:-false}
      - ENABLE_DIRECT_EXECUTION=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # FastMCP HTTP server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: []
    command:
      - python
      - -c
      - |
        import os
        from src.mcp.server import MCPServer

        server = MCPServer()
        server.mcp.run(
            transport="http",
            host="0.0.0.0",
            port=int(os.environ.get("MCP_PORT", "9000")),
        )
    volumes:
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development-only-secret-key-32-chars}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1',9000)))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # MASR Router Service (AI Brain Intelligence)
  masr-router:
    profiles:
      - legacy-masr-service
    build:
      context: .
      dockerfile: docker/Dockerfile.masr
    volumes:
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379/1
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - MASR_PORT=9100
      - MASR_DEFAULT_STRATEGY=balanced
      - MASR_ENABLE_ADAPTIVE=${MASR_ENABLE_ADAPTIVE:-true}
      - ADAPTIVE_ROUTING_ENABLED=false
      - MASR_ENABLE_CACHING=true
      - MASR_ENABLE_LEARNING=true
      - MASR_QUALITY_THRESHOLD=0.85
      - MASR_MAX_AGENTS=8
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "9100:9100"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=research
      - POSTGRES_PASSWORD=research123
      - POSTGRES_DB=research_db
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # pgAdmin for Database Management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@research.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    profiles:
      - dev-tools

  # Redis Commander (Development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    profiles:
      - dev-tools

  # React Web Frontend
  web:
    build:
      context: ./cerebro/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1  # Points via nginx if we had it, but actually the web's nginx proxies? Wait, no we serve static files. If it's static, /api/v1 works if we access the app via a reverse proxy that routes /api/v1 to `api` container, or the web's own nginx handles proxying. 
    ports:
      # Container nginx listens on 8080 so it can run as the unprivileged
      # `nginx` user; host-side mapping keeps the same `localhost:3000`
      # developer entrypoint.
      - "${WEB_HOST_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - research-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  research-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
