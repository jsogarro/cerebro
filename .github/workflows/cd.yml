name: CD Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        default: false
        type: boolean

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  REGISTRY: gcr.io

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      namespace: ${{ steps.determine.outputs.namespace }}
    
    steps:
      - name: Determine environment
        id: determine
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "namespace=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "namespace=staging" >> $GITHUB_OUTPUT
          fi

  pre-deployment-checks:
    name: Pre-deployment Checks
    needs: determine-environment
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          enable-cache: true
      
      - name: Install dependencies
        run: |
          UV_SYSTEM_PYTHON=1 scripts/install-locked.sh --extra dev
      
      - name: Run smoke tests
        run: |
          pytest tests/test_api.py::TestHealthEndpoints -v
      
      - name: Validate Kubernetes manifests
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          python scripts/verify_deployment_assets.py --allow-placeholder-digest k8s

  build-image:
    name: Build and Push API Image
    needs: [determine-environment, pre-deployment-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get image tag
        id: image-tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/research-platform-api:${{ steps.image-tags.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: [determine-environment, pre-deployment-checks, build-image]
    if: needs.determine-environment.outputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
      
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      
      - name: Set up Python for manifest validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install manifest validator dependency
        run: pip install pyyaml==6.0.4

      - name: Update Kubernetes manifests
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          # `kustomize edit set image X=Y@` with an empty digest exits 0 and
          # drops the digest, which would deploy :latest.
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid image digest: '$IMAGE_DIGEST'" >&2; exit 1; }
          cd k8s
          kustomize edit set image \
            gcr.io/PROJECT_ID/research-platform-api=${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/research-platform-api@"$IMAGE_DIGEST"
          kustomize edit set namespace staging
          cd ..
          python scripts/verify_deployment_assets.py k8s
      
      - name: Deploy to staging
        run: |
          kustomize build k8s/ | kubectl apply -f -
          kubectl rollout status deployment/research-api -n staging --timeout=5m
      
      - name: Run smoke tests
        run: |
          STAGING_URL=$(kubectl get ingress research-platform-ingress -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -f "http://$STAGING_URL/health"; then
              echo "Service is ready"
              break
            fi
            echo "Waiting for service..."
            sleep 10
          done
          
          # Run smoke tests against staging
          curl -f "http://$STAGING_URL/health" || exit 1
          curl -f "http://$STAGING_URL/ready" || exit 1
      
      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: `http://staging.research-platform.io`,
              description: 'Deployment to staging successful'
            });

  deploy-production:
    name: Deploy to Production
    needs: [determine-environment, pre-deployment-checks, build-image]
    if: needs.determine-environment.outputs.environment == 'production' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
      
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      
      - name: Create production namespace if not exists
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Set up Python for manifest validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install manifest validator dependency
        run: pip install pyyaml==6.0.4

      - name: Deploy new version
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid image digest: '$IMAGE_DIGEST'" >&2; exit 1; }
          cd k8s

          kustomize edit set image \
            gcr.io/PROJECT_ID/research-platform-api=${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/research-platform-api@"$IMAGE_DIGEST"
          kustomize edit set namespace production

          # The edited overlay must carry a real digest, not the placeholder.
          python ../scripts/verify_deployment_assets.py .

          kustomize build . | kubectl apply -f -

          # The Deployment rolls pods gradually and keeps the previous
          # ReplicaSet, which the rollback job restores with `rollout undo`.
          kubectl rollout status deployment/research-api -n production --timeout=10m

      - name: Verify production deployment
        run: |
          PROD_URL=$(kubectl get ingress research-platform-ingress -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          curl -f "http://$PROD_URL/health" || exit 1
          curl -f "http://$PROD_URL/ready" || exit 1

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'Release ${{ github.ref_name }}',
              body: 'Production deployment of Research Platform ${{ github.ref_name }}',
              draft: false,
              prerelease: false
            });
            
            console.log(`Created release: ${release.data.html_url}`);

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment: production
    if: failure() && needs.deploy-production.result == 'failure'
    needs: deploy-production
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
      
      - name: Perform rollback
        run: |
          kubectl rollout undo deployment/research-api -n production
          kubectl rollout status deployment/research-api -n production --timeout=10m

      - name: Notify rollback
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Production deployment failed - Rollback executed',
              body: `The production deployment for ${context.ref} failed and was automatically rolled back.
              
              Please investigate the failure before attempting another deployment.
              
              Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deployment', 'production', 'incident']
            });
