name: Claude Assistant
# Disabled until the Claude Code GitHub App is installed on this repo.
# Re-enable by uncommenting the trigger list below once
# https://github.com/apps/claude is installed and ANTHROPIC_API_KEY is
# set as a repository secret.
on:
  workflow_dispatch:  # manual trigger only
  # issue_comment:
  #   types: [created]
  # pull_request_review_comment:
  #   types: [created]
  # issues:
  #   types: [opened, assigned, labeled]
  # pull_request_review:
  #   types: [submitted]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
