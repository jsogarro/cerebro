name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.7"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      
      - name: Install dependencies
        run: |
          UV_SYSTEM_PYTHON=1 scripts/install-locked.sh --extra dev
      
      - name: Run ruff
        run: |
          ruff check --no-fix src tests
      
      - name: Check ruff formatting
        run: |
          ruff format --check src tests
      
      - name: Run mypy
        run: |
          mypy src

  test:
    name: Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: research_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      
      - name: Install dependencies
        run: |
          UV_SYSTEM_PYTHON=1 scripts/install-locked.sh --extra dev

      - name: Run golden dataset regression tests
        run: |
          pytest -o addopts='' tests/regression -q
      
      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz"
          echo "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/research_test
          REDIS_URL: redis://localhost:6379
          TEMPORAL_HOST: localhost:7233
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term --ignore=tests/e2e \
            --junit-xml=test-results/junit-${{ matrix.python-version }}.xml

      - name: Test summary
        if: always()
        run: |
          python scripts/ci_summary.py "test-results/junit-${{ matrix.python-version }}.xml" coverage.xml >> "$GITHUB_STEP_SUMMARY" \
            || echo "Test summary unavailable: JUnit or coverage artifact missing" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML and JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            htmlcov/
            test-results/
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=25


  linux-sandbox:
    name: Linux Sandbox Controls
    runs-on: ubuntu-latest
    env:
      # A listed module that is skipped or never collected fails the run
      # (tests/conftest.py, #278). Unknown entries fail closed.
      CEREBRO_REQUIRED_LINUX_MODULES: tests/unit/core/test_process_hardening.py,tests/test_extraction_sandbox.py

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run required sandbox modules
        run: |
          pytest --no-cov -o addopts='' -ra --strict-markers \
            --junit-xml=test-results/linux-sandbox.xml \
            tests/unit/core/test_process_hardening.py \
            tests/test_extraction_sandbox.py \
            tests/test_linux_sandbox_guard.py

      - name: Install WeasyPrint system libraries and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            poppler-utils

      # The flags turn "engine missing" skips into failures, so the PDF and
      # TeX hardening tests cannot pass by not running.
      - name: Run exporter hardening tests with required engines
        env:
          CEREBRO_REQUIRED_LINUX_MODULES: tests/unit/test_exporter_output_hardening.py
          CEREBRO_REQUIRE_WEASYPRINT: "1"
          CEREBRO_REQUIRE_PDFLATEX: "1"
        run: |
          pytest --no-cov -o addopts='' -ra --strict-markers \
            --junit-xml=test-results/linux-exporters.xml \
            tests/unit/test_exporter_output_hardening.py

      - name: Test summary
        if: always()
        run: |
          for f in test-results/linux-sandbox.xml test-results/linux-exporters.xml; do
            python scripts/ci_summary.py "$f" >> "$GITHUB_STEP_SUMMARY" \
              || echo "Test summary unavailable for $f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-sandbox-junit
          path: test-results/

  test-cli:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      
      - name: Install dependencies
        run: |
          UV_SYSTEM_PYTHON=1 scripts/install-locked.sh --extra dev
      
      - name: Test CLI installation
        run: |
          research-cli --version
          research-cli --help
      
      - name: Run CLI tests
        run: |
          pytest tests/test_cli.py -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      
      - name: Install dependencies
        run: |
          uv pip install --system bandit[toml] pip-audit "setuptools>=83.0.0"
      
      - name: Run bandit
        run: |
          bandit -r src -f json -o bandit-report.json --exit-zero
      
      - name: Run pip-audit
        run: |
          pip-audit
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json

  validate-docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Validate Dockerfile
        run: |
          for dockerfile in Dockerfile; do
            if [ -f "$dockerfile" ]; then
              echo "Linting $dockerfile"
              docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$dockerfile"
            else
              echo "Skipping $dockerfile (not present in tree)"
            fi
          done
      
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: research-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
      
      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: ./cerebro/web
          file: ./cerebro/web/Dockerfile
          push: false
          tags: research-platform-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'
      

      - name: Validate manifests
        run: |
          # kubectl --dry-run=client still hits the apiserver for resource
          # discovery (fails offline with "connection refused"). Use yamllint
          # for pure-syntax validation of every k8s manifest and rely on
          # `kustomize build` below for structural validation.
          pip install --quiet yamllint
          YAMLLINT_CFG='{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, new-line-at-end-of-file: disable, indentation: disable, comments: {min-spaces-from-content: 1}}}'
          for file in k8s/*.yaml; do
            echo "Linting $file"
            yamllint -d "$YAMLLINT_CFG" "$file"
          done
      
      - name: Build kustomization
        run: kubectl kustomize k8s > /dev/null

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for 26.04
    defaults:
      run:
        working-directory: ./cerebro/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './cerebro/web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Mocked UI contract specs; the real-backend golden run is in e2e-tests.yml.
      - name: Playwright UI contract tests
        env:
          PLAYWRIGHT_ISOLATED: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/playwright-contract.xml
        run: npm run test:e2e:contract -- --reporter=list,junit

      - name: Test summary
        if: always()
        working-directory: .
        run: |
          python scripts/ci_summary.py cerebro/web/test-results/playwright-contract.xml >> "$GITHUB_STEP_SUMMARY" \
            || echo "Test summary unavailable for Playwright contract tests" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-contract-report
          path: |
            cerebro/web/test-results/
            cerebro/web/playwright-report/

  all-checks:
    name: All CI Checks
    needs: [lint, test, linux-sandbox, test-cli, security, validate-docker, validate-k8s, frontend-ci]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all job statuses
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # cancelled and skipped are not success: a skipped required job
          # means an upstream failure or a masked check.
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "One or more required CI jobs did not succeed"
            exit 1
          fi
          echo "All required CI jobs succeeded"
