name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  e2e-python:
    name: E2E Python Tests (docker-compose stack)
    runs-on: ubuntu-24.04  # Playwright in cerebro/web has no Chromium build for 26.04
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: cerebro/web/package-lock.json

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Install Python dependencies
      run: |
        UV_SYSTEM_PYTHON=1 scripts/install-locked.sh --extra dev

    - name: Install web dependencies and Chromium
      working-directory: cerebro/web
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Start services with Docker Compose
      env:
        # Fake keys: no journey makes a provider call. A journey that would
        # need a model is a strict xfail until the dry-run packet lands.
        SECRET_KEY: ci-test-secret-key-32-bytes-of-entropy-for-jwt-signing-only
        JWT_SECRET_KEY: ci-test-jwt-secret-key-32-bytes-of-entropy-for-signing
        GEMINI_API_KEY: ci-test-gemini-key-not-used-by-e2e-suite
        # Every e2e request shares one client IP, so the default 100 per
        # window throttles the suite itself; no test asserts that limit.
        MAX_REQUESTS_PER_MINUTE: "1000"
      run: |
        docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
        timeout 90 bash -c 'until curl -fsS http://localhost:8000/health; do sleep 2; done'

    - name: Run Python e2e tests and journeys
      env:
        BASE_URL: http://localhost:8000
        # The compose postgres publishes 5432 with these credentials.
        E2E_DATABASE_URL: postgresql://research:research123@localhost:5432/research_db
      run: |
        pytest tests/e2e/ \
          --no-cov \
          --junit-xml=test-results/python-e2e/results.xml \
          -v

    - name: Run Playwright against the real backend
      working-directory: cerebro/web
      env:
        PLAYWRIGHT_REAL_BACKEND: '1'
        PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8000
        VITE_API_URL: http://127.0.0.1:8000
        CI: 'true'
      run: npx playwright test golden-run.spec.ts --retries=0 --trace=retain-on-failure

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-artifacts
        path: |
          test-results/
          cerebro/web/test-results/
          cerebro/web/playwright-report/
        retention-days: 7

    - name: Dump docker-compose logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
        docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > docker-compose.log
      continue-on-error: true

    - name: Upload docker-compose logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-docker-logs
        path: docker-compose.log
        retention-days: 7

    - name: Stop services
      if: always()
      run: |
        docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
