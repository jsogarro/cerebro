version: '3.9'

services:
  # One-shot: applies the database roles with the admin credential so the
  # runtime container never holds it.
  db-roles:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    entrypoint: ["python", "/docker/apply_roles.py"]
    environment:
      - ROLES_ADMIN_DATABASE_URL=postgresql+asyncpg://research:${DB_PASSWORD}@postgres:5432/research_db
      - CEREBRO_MIGRATOR_PASSWORD=${CEREBRO_MIGRATOR_PASSWORD:?}
      - CEREBRO_APP_PASSWORD=${CEREBRO_APP_PASSWORD:?}
      - CEREBRO_MAINT_PASSWORD=${CEREBRO_MAINT_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cerebro-prod
    restart: "no"

  # FastAPI Application (Production)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cerebro-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cerebro_app:${CEREBRO_APP_PASSWORD:?}@postgres:5432/research_db
      - MIGRATION_DATABASE_URL=postgresql+asyncpg://cerebro_migrator:${CEREBRO_MIGRATOR_PASSWORD:?}@postgres:5432/research_db
      - MAINTENANCE_DATABASE_URL=postgresql+asyncpg://cerebro_maint:${CEREBRO_MAINT_PASSWORD:?}@postgres:5432/research_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Direct execution uses the FastAPI-owned in-process MASR runtime.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
      - MCP_SERVER_ENABLED=${MCP_SERVER_ENABLED:-true}
      
      # MASR Configuration
      - MASR_ENABLE_ROUTING=true
      - MASR_DEFAULT_STRATEGY=balanced
      - MASR_ENABLE_LEARNING=true
      - MASR_MAX_AGENTS=10
      - MASR_QUALITY_THRESHOLD=0.85
      
      # Performance settings
    depends_on:
      db-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerebro-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: jwt_private_key
        target: jwt_private.pem
      - source: jwt_public_key
        target: jwt_public.pem
    read_only: true
    volumes:
      - source_snapshots_prod:/var/lib/cerebro/source_snapshots
    tmpfs:
      - /tmp
      - /var/cache/nginx

  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: cerebro-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=research
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=research_db
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      postgres
      -c log_statement=all
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerebro-prod
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  # Redis Cache (Production)
  redis:
    image: redis:7-alpine
    container_name: cerebro-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerebro-prod
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.2"
    security_opt:
      - no-new-privileges:true

  # React Web Frontend (Production)
  web:
    build:
      context: ./cerebro/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: cerebro-web-prod
    restart: always
    depends_on:
      - api
    networks:
      - cerebro-prod
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: cerebro-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - cerebro-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true

  # Prometheus Monitoring (Production)
  prometheus:
    image: prom/prometheus:latest
    container_name: cerebro-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    networks:
      - cerebro-prod
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.2"
    security_opt:
      - no-new-privileges:true

  # Grafana Dashboard (Production)
  grafana:
    image: grafana/grafana:latest
    container_name: cerebro-grafana-prod
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    depends_on:
      - prometheus
    networks:
      - cerebro-prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.3"
        reservations:
          memory: 128M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true

networks:
  cerebro-prod:
    driver: bridge
    name: cerebro-production
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      driver: default
      config:
        - subnet: "172.20.0.0/16"

volumes:
  postgres_data_prod:
    name: cerebro-postgres-data-prod
    driver: local
  redis_data_prod:
    name: cerebro-redis-data-prod
    driver: local
  source_snapshots_prod:
    name: cerebro-source-snapshots-prod
    driver: local
  prometheus_data:
    name: cerebro-prometheus-data
    driver: local
  grafana_data:
    name: cerebro-grafana-data
    driver: local
  nginx_logs:
    name: cerebro-nginx-logs
    driver: local

# Production secrets (should be managed externally)
secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:?JWT_PRIVATE_KEY_FILE must point to the production RSA private PEM}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:?JWT_PUBLIC_KEY_FILE must point to the matching production RSA public PEM}
